name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Diagnose lockfile drift
        run: |
          bun install --lockfile-only
          git diff -- bun.lock
          git diff --exit-code -- bun.lock
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
